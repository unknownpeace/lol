name: "✨ Feature Request"
description: "Suggest a new Homelab module, WebUI/LuCI improvement, CLI feature, or routing enhancement"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: "Use case / problem statement"
      placeholder: "What workflow or limitation would this solve?"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "Proposed design (Alpine Linux OpenRC &/or OpenWrt >= 25.12.6 compatible)"
      placeholder: "Describe how the feature should work with POSIX sh, apk, zero Docker, and zero Node/npm build chains."
    validations:
      required: true
